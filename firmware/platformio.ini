; Meshmerize robot firmware - PlatformIO project (ESP32-WROOM-32 DevKitC)
;
; Pick the environment that matches YOUR motor driver:
;   pio run -e esp32_l298n   -t upload     L298N (big red module with heatsink)   <- default
;   pio run -e esp32_tb6612  -t upload     TB6612FNG (small module with STBY pin)
;   pio run -e esp32_drv8833 -t upload     DRV8833 / MX1508 (4 IN pins, no enable)
; Debug builds (event log + 20 Hz telemetry on USB serial, practice arena only):
;   pio run -e esp32_l298n_debug -t upload && pio device monitor
;   pio run -t erase                     wipe flash INCLUDING the stored map (NVS)

[platformio]
default_envs = esp32_l298n

[env]
platform = espressif32@8.0.0          ; Arduino-ESP32 core 3.3.12 (ESP-IDF 5)
board = esp32dev
framework = arduino
build_src_filter = +<*> -<sim_api/>
build_unflags = -Os
build_flags =
  -O2
  -Wall
  -Wno-unused-parameter
  -Iinclude
monitor_speed = 115200
upload_speed = 921600

[env:esp32_l298n]
build_flags = ${env.build_flags} -D MESH_DRIVER=2 -D MESH_PWM_HZ=1000

[env:esp32_tb6612]
build_flags = ${env.build_flags} -D MESH_DRIVER=1

[env:esp32_drv8833]
build_flags = ${env.build_flags} -D MESH_DRIVER=3

[env:esp32_l298n_debug]
build_flags = ${env.build_flags} -D MESH_DRIVER=2 -D MESH_PWM_HZ=1000 -D MESH_DEBUG_SERIAL

[env:esp32_tb6612_debug]
build_flags = ${env.build_flags} -D MESH_DRIVER=1 -D MESH_DEBUG_SERIAL

[env:esp32_drv8833_debug]
build_flags = ${env.build_flags} -D MESH_DRIVER=3 -D MESH_DEBUG_SERIAL
